# fly.toml app configuration file for alice-x-forest-heartbeat
#
# Hintergrund-Worker + Reingest-HTTP-Endpunkt.  Pollt alle 2 Minuten auf
# offene heartbeat_slots (heartbeat.Runner) und nimmt per HTTP geaenderte
# Vault-Dateien vom Reingest-Scanner entgegen (roots_reingest.py → POST
# /api/v1/memories/reingest).  Laeuft dauerhaft, kein auto-stop.
app = 'alice-x-forest-heartbeat'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
